# ═══════════════════════════════════════════════════════════════════════════
# TEMPORARY CORS SHIM — CapRover per-app nginx config
#
# Why this exists: the Node app already sets these headers correctly (see
# src/config/cors.ts), but the rebuilt image is not rolling out, so the live
# container still runs code from before that fix. This makes the admin panel
# work at the proxy layer while that rollout is untangled.
#
# WHERE IT GOES
#   CapRover → Apps → talent-pro-backend → HTTP Settings
#   → "Edit Default Nginx Configurations" → paste inside the `location /`
#     block, immediately after the `proxy_pass` line → Save & Update.
#
# HOW TO REMOVE (do this once the app rolls out — see the check below)
#   Delete everything between the two banner comments, Save & Update.
#   Leaving it in place after the app is fixed is not merely redundant: the
#   `proxy_hide_header` lines below keep it correct, but the allowlist then
#   lives in two places and will drift.
#
# WHEN TO REMOVE
#   curl -s https://talent-pro-backend.dev-api.softweirdo.com/health
#   Once that response contains a "commit" field, the new build is live and
#   the app is setting its own CORS headers. Remove this then.
#
# ⚠ ONE NGINX GOTCHA BEFORE YOU PASTE
#   nginx's `add_header` inheritance REPLACES rather than merges. If the
#   CapRover template you are editing has any `add_header` directives at the
#   `server` level (HSTS is the common one), adding these inside `location /`
#   silently drops them. If you see any, copy them into the same location
#   block alongside these.
# ═══════════════════════════════════════════════════════════════════════════

# ── BEGIN TEMPORARY CORS SHIM ──────────────────────────────────────────────

# Reflect the caller's origin, but only when we recognise it. A credentialed
# request may not use `*`, so the exact origin has to be echoed back. Leaving
# the variable empty makes nginx omit the header entirely, which is the
# correct way to refuse — the browser then reports the real reason instead of
# an opaque failure.
set $cors_origin "";

# Production panel, plus Cloudflare Pages preview deploys, which each get
# their own <hash>.talentpro-admin.pages.dev hostname. Anchored at both ends,
# so talentpro-admin.pages.dev.attacker.com does not match.
if ($http_origin ~* '^https://([a-z0-9-]+\.)?talentpro-admin\.pages\.dev$') {
    set $cors_origin $http_origin;
}

# Local dev servers: Vite on 5173, Expo web on 8081. A browser treats
# localhost and 127.0.0.1 as different origins, so both spellings are listed.
if ($http_origin ~* '^http://(localhost|127\.0\.0\.1):(5173|8081)$') {
    set $cors_origin $http_origin;
}

# Answer the preflight here rather than passing it upstream, so nothing on the
# app side — the login rate limiter in particular — can turn an OPTIONS into a
# 401 or 429. A non-2xx preflight reaches the browser as "Network Error".
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Access-Control-Allow-Methods     'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
    add_header Access-Control-Max-Age           86400 always;
    add_header Vary                             'Origin' always;
    add_header Content-Length                   0;
    return 204;
}

# Strip whatever the app sends before setting our own. This is what keeps the
# shim safe the moment the new build finally rolls out: without it there would
# be two Access-Control-Allow-Origin headers, which browsers reject exactly as
# hard as zero. Vary is deliberately not hidden — the app's
# `Vary: Origin, Accept-Encoding` still matters for compression caching, and
# repeated Vary headers are merged by caches.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;

# `always` is load-bearing. Without it nginx skips add_header on 4xx/5xx, and
# a failed sign-in is a 401 — precisely the response the panel must be able to
# read to show "Incorrect email or password" instead of "Network Error".
add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials 'true' always;
add_header Access-Control-Expose-Headers    'Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining' always;
add_header Vary                             'Origin' always;

# ── END TEMPORARY CORS SHIM ────────────────────────────────────────────────
